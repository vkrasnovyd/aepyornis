<div class="d-flex flex-row min-vh-100">
  <app-sidebar
    [isOpen]="sidebarOpen()"
    [showMobileSidebar]="showMobileSidebar()"
    (toggleMobileSidebar)="toggleMobileSidebar($event)"
  />

  <div class="app-content">
    <app-header
      class="sticky-top"
      [isAdmin]="isAdmin()"
      [showMobileSidebar]="showMobileSidebar()"
      [showSidebar]="sidebarOpen()"
      [userName]="userName()"
      (logout)="handleLogout()"
      (toggleMobileSidebar)="toggleMobileSidebar($event)"
      (toggleSidebar)="toggleSidebar()"
    />

    <main class="flex-grow-1 main-content">
      <router-outlet />
    </main>

    @if (!isFeedRoute()) {
      <app-footer />
    }
  </div>
</div>
